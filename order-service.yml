server:
  port: 8082
  
spring:
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: admin
eureka:
  client:
    instance:
      hostname: localhost
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
